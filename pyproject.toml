[project]
name = "quant-research"
version = "0.1.0"
description = "Quant research + paper-trading system targeting the Microsoft Qlib benchmark leaderboard"
requires-python = ">=3.11,<3.12"
# Ranges here are upper/lower bounds only; exact pins live in uv.lock.
dependencies = [
    "pyqlib>=0.9.6,<0.10",
    "numpy>=1.26,<2",
    "pandas>=2.0,<2.3",
    "lightgbm>=4.3,<5",
    "xgboost>=2.0,<3",
    # torch >=2.3 stopped publishing x86_64 macOS wheels; last Intel-Mac build is 2.2.x
    "torch>=2.2,<2.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch>=2.2,<2.7; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "pyarrow>=15,<20",
    "matplotlib>=3.8,<4",
    "tabulate>=0.9",
    "scikit-learn>=1.4,<1.7",
    # qlib 0.9.x expects the mlflow 2.x file-store tracking backend;
    # mlflow 3 puts it in maintenance mode and rejects it
    "mlflow>=2.9,<3",
    "optuna>=3.6,<4",
    "cvxpy>=1.5,<2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_research"]

[tool.ruff]
line-length = 110
target-version = "py311"

# Phase-2 walk-forward spec — CSI300, qlib community cn_data.
# OOF folds = expanding windows; holdout = last ~2y of the dump (never used
# for tuning, stacking weights, or candidate selection).
market: cn
region: cn
provider_uri: data/qlib/cn_data
instruments: csi300
benchmark: SH000300
account: 100000000
data_start: "2008-01-01"
data_end: "2020-08-01"
valid_days: 365
label: "Ref($close, -2) / Ref($close, -1) - 1"

eval_folds:
    - ["2015-01-01", "2015-12-31"]
    - ["2016-01-01", "2016-12-31"]
    - ["2017-01-01", "2017-12-31"]
    - ["2018-01-01", "2018-07-31"]

holdout: ["2018-08-01", "2020-08-01"]

handler:
    infer_processors:
        - class: RobustZScoreNorm
          kwargs:
              fields_group: feature
              clip_outlier: true
        - class: Fillna
          kwargs:
              fields_group: feature
    learn_processors:
        - class: DropnaLabel
        - class: CSRankNorm
          kwargs:
              fields_group: label

# Published qlib benchmark hyperparameters (same as configs/benchmarks/*_cn).
models:
    lgb:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        feature_set: alpha158
        kwargs:
            loss: mse
            colsample_bytree: 0.8879
            learning_rate: 0.2
            subsample: 0.8789
            lambda_l1: 205.6999
            lambda_l2: 580.9768
            max_depth: 8
            num_leaves: 210
            num_threads: 4
    xgb:
        class: XGBModel
        module_path: qlib.contrib.model.xgboost
        feature_set: alpha158
        kwargs:
            eval_metric: rmse
            colsample_bytree: 0.8879
            eta: 0.0421
            max_depth: 8
            n_estimators: 647
            subsample: 0.8789
            nthread: 4
    de:
        class: DEnsembleModel
        module_path: qlib.contrib.model.double_ensemble
        feature_set: alpha158
        kwargs:
            base_model: "gbm"
            loss: mse
            num_models: 3
            enable_sr: true
            enable_fs: true
            alpha1: 1
            alpha2: 1
            bins_sr: 10
            bins_fs: 5
            decay: 0.5
            sample_ratios: [0.8, 0.7, 0.6, 0.5, 0.4]
            sub_weights: [1, 1, 1]
            epochs: 28
            colsample_bytree: 0.8879
            learning_rate: 0.2
            subsample: 0.8789
            lambda_l1: 205.6999
            lambda_l2: 580.9768
            max_depth: 8
            num_leaves: 210
            num_threads: 4
            verbosity: -1
    lgb360:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        feature_set: alpha158_360
        kwargs:
            loss: mse
            colsample_bytree: 0.8879
            learning_rate: 0.2
            subsample: 0.8789
            lambda_l1: 205.6999
            lambda_l2: 580.9768
            max_depth: 8
            num_leaves: 210
            num_threads: 4
    # GPU slots — filled only when run on a GPU box (Kaggle notebook path).
    # hist is the priority ensemble component (phase-1 IR 1.36, our best single
    # model); its results/oof/cn/hist__fold*.pkl join rank_avg + ridge_stack
    # automatically once a `hist_cn_wf` Kaggle run pushes them.
    transformer:
        class: TransformerModel
        module_path: qlib.contrib.model.pytorch_transformer_ts
        feature_set: alpha158
        requires_gpu: true
        step_len: 20            # TSDatasetH-style sampler
        kwargs:
            seed: 0
            n_jobs: 4
            GPU: 0
    hist:
        class: HIST
        module_path: qlib.contrib.model.pytorch_hist
        feature_set: alpha360
        requires_gpu: true
        kwargs:
            d_feat: 6
            hidden_size: 64
            num_layers: 2
            dropout: 0
            n_epochs: 200
            lr: 0.0001
            early_stop: 20
            metric: ic
            loss: mse
            base_model: LSTM
            model_path: configs/benchmarks/assets/model_lstm_csi300.pkl
            stock2concept: configs/benchmarks/assets/qlib_csi300_stock2concept.npy
            stock_index: configs/benchmarks/assets/qlib_csi300_stock_index.npy
            GPU: 0

strategies:
    topk:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            topk: 50
            n_drop: 5
    mvo:
        class: TurnoverPenalizedMVO
        module_path: quant_research.strategy
        kwargs:
            n_stock: 80
            lookback: 60
            risk_lambda: 10.0
            turnover_lambda: 0.02
            max_weight: 0.05

# CN costs (qlib published benchmark convention).
exchange_kwargs:
    limit_threshold: 0.095
    deal_price: close
    open_cost: 0.0005
    close_cost: 0.0015
    min_cost: 5

ensemble:
    ridge_alpha: 1.0

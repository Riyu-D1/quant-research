# Phase 2 (c): stacked ensemble over the four Phase-1 signal models.
# scripts/stack_ensemble.py loads each component's saved pred.pkl/label.pkl
# (located via results/runs/*.json recorder ids), fits a ridge meta-model on
# the VALIDATION window, predicts on test, and backtests with TopkDropout.
components:
    lightgbm:  results/runs/lightgbm_alpha158_cn.json
    xgboost:   results/runs/xgboost_alpha158_cn.json
    doubleensemble: results/runs/doubleensemble_alpha158_cn.json
    transformer: results/runs/transformer_alpha158_cn.json
meta_learner:
    class: ridge
    alpha: 1.0
valid_window: [2015-01-01, 2016-12-31]
test_window: [2017-01-01, 2020-08-01]
out_pred: results/runs/stacked_pred.pkl
out: results/runs/stacked_cn.json
strategy:
    class: TopkDropoutStrategy
    module_path: qlib.contrib.strategy
    kwargs:
        topk: 50
        n_drop: 5
backtest:
    start_time: 2017-01-01
    end_time: 2020-08-01
    account: 100000000
    benchmark: SH000300
    exchange_kwargs:
        limit_threshold: 0.095
        deal_price: close
        open_cost: 0.0005
        close_cost: 0.0015
        min_cost: 5

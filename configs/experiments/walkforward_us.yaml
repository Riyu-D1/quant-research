# Phase-2 walk-forward spec — S&P 500 point-in-time, Alpaca-built dump.
# Holdout = 2025-01-01 onward (never used for tuning/stacking/selection).
market: us
region: us
provider_uri: data/qlib/us_alpaca
instruments: sp500
benchmark: SPY     # Alpaca dump has no ^GSPC index; SPY ETF is the benchmark
account: 100000000
data_start: "2016-01-01"
data_end: "2026-11-01"
valid_days: 365
label: "Ref($close, -2) / Ref($close, -1) - 1"

eval_folds:
    - ["2021-01-01", "2021-12-31"]
    - ["2022-01-01", "2022-12-31"]
    - ["2023-01-01", "2023-12-31"]
    - ["2024-01-01", "2024-12-31"]

holdout: ["2025-01-01", "2026-11-01"]

handler:
    infer_processors:
        - class: RobustZScoreNorm
          kwargs:
              fields_group: feature
              clip_outlier: true
        - class: Fillna
          kwargs:
              fields_group: feature
    learn_processors:
        - class: DropnaLabel
        - class: CSRankNorm
          kwargs:
              fields_group: label

# Same published hyperparameters as the CN spec — feature pipeline and model
# params are identical across markets by design.
models:
    lgb:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        feature_set: alpha158
        kwargs:
            loss: mse
            colsample_bytree: 0.8879
            learning_rate: 0.2
            subsample: 0.8789
            lambda_l1: 205.6999
            lambda_l2: 580.9768
            max_depth: 8
            num_leaves: 210
            num_threads: 4
    xgb:
        class: XGBModel
        module_path: qlib.contrib.model.xgboost
        feature_set: alpha158
        kwargs:
            eval_metric: rmse
            colsample_bytree: 0.8879
            eta: 0.0421
            max_depth: 8
            n_estimators: 647
            subsample: 0.8789
            nthread: 4
    de:
        class: DEnsembleModel
        module_path: qlib.contrib.model.double_ensemble
        feature_set: alpha158
        kwargs:
            base_model: "gbm"
            loss: mse
            num_models: 3
            enable_sr: true
            enable_fs: true
            alpha1: 1
            alpha2: 1
            bins_sr: 10
            bins_fs: 5
            decay: 0.5
            sample_ratios: [0.8, 0.7, 0.6, 0.5, 0.4]
            sub_weights: [1, 1, 1]
            epochs: 28
            colsample_bytree: 0.8879
            learning_rate: 0.2
            subsample: 0.8789
            lambda_l1: 205.6999
            lambda_l2: 580.9768
            max_depth: 8
            num_leaves: 210
            num_threads: 4
            verbosity: -1
    lgb360:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        feature_set: alpha158_360
        kwargs:
            loss: mse
            colsample_bytree: 0.8879
            learning_rate: 0.2
            subsample: 0.8789
            lambda_l1: 205.6999
            lambda_l2: 580.9768
            max_depth: 8
            num_leaves: 210
            num_threads: 4
    # GPU slots — filled only when run on a GPU box (Kaggle notebook path).
    transformer:
        class: TransformerModel
        module_path: qlib.contrib.model.pytorch_transformer_ts
        feature_set: alpha158
        requires_gpu: true
        step_len: 20            # TSDatasetH-style sampler
        kwargs:
            seed: 0
            n_jobs: 4
            GPU: 0
    hist:
        class: HIST
        module_path: qlib.contrib.model.pytorch_hist
        feature_set: alpha360
        requires_gpu: true
        kwargs:
            d_feat: 6
            hidden_size: 64
            num_layers: 2
            dropout: 0
            n_epochs: 200
            lr: 0.0001
            early_stop: 20
            metric: ic
            loss: mse
            base_model: LSTM
            model_path: configs/benchmarks/assets/model_lstm_csi300.pkl
            stock2concept: configs/benchmarks/assets/qlib_sp500_stock2concept.npy
            stock_index: configs/benchmarks/assets/qlib_sp500_stock_index.npy
            needs_concept_assets: true
            GPU: 0

strategies:
    topk:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            topk: 50
            n_drop: 5
    mvo:
        class: TurnoverPenalizedMVO
        module_path: quant_research.strategy
        kwargs:
            n_stock: 80
            lookback: 60
            risk_lambda: 10.0
            turnover_lambda: 0.02
            max_weight: 0.05

# US costs: 5bps commission + 5bps slippage folded into per-side cost
# (qlib daily backtest has no explicit slippage knob).
exchange_kwargs:
    limit_threshold: null   # no daily price limit in the US
    deal_price: close
    open_cost: 0.001
    close_cost: 0.001
    min_cost: 0

ensemble:
    ridge_alpha: 1.0

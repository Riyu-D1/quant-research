# Phase 2 (a): LightGBM on concatenated Alpha158 + Alpha360 features — US
# (S&P 500 PIT, Alpaca dump). Single-split reference config for
# scripts/run_benchmark.py; the authoritative Phase-2 protocol (walk-forward
# folds + untouched 2025+ holdout) lives in walkforward_us.yaml and is run by
# scripts/phase2_run.py (model key `lgb360`).
qlib_init:
    provider_uri: "~/.qlib/qlib_data/us_data"   # overridden at runtime
    region: us
market: &market sp500
benchmark: &benchmark SPY   # alpaca dump has no ^GSPC index; SPY ETF is the benchmark
data_handler_config: &data_handler_config
    start_time: 2016-01-01
    end_time: 2024-12-31        # keep 2025+ untouched (phase-2 holdout)
    fit_start_time: 2016-01-01
    fit_end_time: 2021-12-31
    instruments: *market
    infer_processors:
        - class: RobustZScoreNorm
          kwargs:
              fields_group: feature
              clip_outlier: true
        - class: Fillna
          kwargs:
              fields_group: feature
    learn_processors:
        - class: DropnaLabel
        - class: CSRankNorm
          kwargs:
              fields_group: label
    label: ["Ref($close, -2) / Ref($close, -1) - 1"]
port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 50
            n_drop: 5
    backtest:
        start_time: 2024-01-01
        end_time: 2024-12-31    # validation-era slice only
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: null
            deal_price: close
            open_cost: 0.001    # 5bps fee + 5bps slippage per side
            close_cost: 0.001
            min_cost: 0
task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            colsample_bytree: 0.8879
            learning_rate: 0.2
            subsample: 0.8789
            lambda_l1: 205.6999
            lambda_l2: 580.9768
            max_depth: 8
            num_leaves: 210
            num_threads: 20
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158_360
                module_path: quant_research.handler
                kwargs: *data_handler_config
            segments:
                train: [2016-01-01, 2021-12-31]
                valid: [2022-01-01, 2023-12-31]
                test: [2024-01-01, 2024-12-31]
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            ana_long_short: False
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config

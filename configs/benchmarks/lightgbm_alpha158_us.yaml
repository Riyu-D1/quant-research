qlib_init:
    provider_uri: "~/.qlib/qlib_data/us_data"   # overridden at runtime by run_benchmark.py --provider-uri
    region: us
market: &market sp500
benchmark: &benchmark SPY   # alpaca dump has no ^GSPC index; SPY ETF is the benchmark
data_handler_config: &data_handler_config
    start_time: 2016-01-01   # alpaca SIP history starts 2016
    end_time: 2026-11-01
    fit_start_time: 2016-01-01   # alpaca SIP history starts 2016
    fit_end_time: 2021-12-31
    instruments: *market
port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 50
            n_drop: 5
    backtest:
        start_time: 2023-01-01
        end_time: 2026-11-01
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: null  # region=us -> no daily price limit
            deal_price: close
            open_cost: 0.0005
            close_cost: 0.0005
            min_cost: 0
task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            colsample_bytree: 0.8879
            learning_rate: 0.2
            subsample: 0.8789
            lambda_l1: 205.6999
            lambda_l2: 580.9768
            max_depth: 8
            num_leaves: 210
            num_threads: 20
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2016-01-01, 2021-12-31]
                valid: [2022-01-01, 2022-12-31]
                test: [2023-01-01, 2026-11-01]
    record: 
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            ana_long_short: False
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            config: *port_analysis_config

qlib_init:
    provider_uri: "~/.qlib/qlib_data/us_alpaca"   # overridden at runtime
    region: us
market: &market sp500
benchmark: &benchmark SPY   # alpaca dump has no ^GSPC index; SPY ETF is the benchmark
data_handler_config: &data_handler_config
    # alpaca SIP history starts 2016 — do not request earlier dates
    start_time: 2016-01-01
    end_time: 2026-11-01
    fit_start_time: 2016-01-01
    fit_end_time: 2021-12-31
    instruments: *market
    infer_processors:
        - class: RobustZScoreNorm
          kwargs:
              fields_group: feature
              clip_outlier: true
        - class: Fillna
          kwargs:
              fields_group: feature
    learn_processors:
        - class: DropnaLabel
        - class: CSRankNorm
          kwargs:
              fields_group: label
    label: ["Ref($close, -2) / Ref($close, -1) - 1"]
port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 50
            n_drop: 5
    backtest:
        start_time: 2023-01-01
        end_time: 2026-11-01
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: null  # region=us -> no daily price limit
            deal_price: close
            open_cost: 0.0005
            close_cost: 0.0005
            min_cost: 0
task:
    model:
        class: HIST
        module_path: qlib.contrib.model.pytorch_hist
        kwargs:
            d_feat: 6
            hidden_size: 64
            num_layers: 2
            dropout: 0
            n_epochs: 200
            lr: 1e-4
            early_stop: 20
            metric: ic
            loss: mse
            base_model: LSTM
            model_path: null   # no US pretrained base — LSTM initialised fresh and trained jointly
            stock2concept: "configs/benchmarks/assets/qlib_sp500_stock2concept.npy"
            stock_index: "configs/benchmarks/assets/qlib_sp500_stock_index.npy"
            GPU: 0
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha360
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2016-01-01, 2021-12-31]
                valid: [2022-01-01, 2022-12-31]
                test: [2023-01-01, 2026-11-01]
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            ana_long_short: False
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config

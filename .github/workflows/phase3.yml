name: phase3-top-traders

# Phase-3 disclosure-event pipeline on GitHub-hosted runners.
#
# Jobs:
#   fetch    rebuild the event tables (insiders/13F/shares/house) and the
#            PIT feature panel; commits the PARQUET artifacts to this branch
#            so OOF runs stay reproducible.
#   oof      walk-forward over 2021-2024 folds for the events models and/or
#            rule baselines; never touches the holdout.
#   holdout  dispatch ONLY with holdout_candidate="signal@strategy" after an
#            OOF winner is selected — scores once, appends to
#            results/holdout_log.jsonl.
#
# The paper-trading loop is a separate workflow (phase3_paper.yml) that is
# workflow_dispatch-only and refuses the live endpoint.

on:
  workflow_dispatch:
    inputs:
      job:
        description: "fetch (events+panel), oof, or holdout"
        required: true
        type: choice
        options: [fetch, oof, holdout]
        default: oof
      models:
        description: "Comma list (lgb_ev,lgb_ev158,xgb_ev158) — blank = all"
        required: false
        default: ""
      rules:
        description: "Comma list of rule signals (e.g. rule_cluster_hold20) — blank = none"
        required: false
        default: ""
      holdout_candidate:
        description: 'Holdout candidate "signal@strategy" (job=holdout only)'
        required: false
        default: ""
      threads:
        description: "Threads for GBDTs"
        required: false
        default: "4"

permissions:
  contents: write
  actions: read

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  fetch-events:
    if: inputs.job == 'fetch'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --frozen --no-dev

      - name: Fetch Alpaca US qlib dump (needed for universe + panel build)
        run: |
          gh run download -R ${{ github.repository }} -n us-qlib-dump \
            -D data/qlib/us_alpaca
          test -f data/qlib/us_alpaca/calendars/day.txt

      - name: Restore event caches (resume interrupted fetch)
        uses: actions/cache@v4
        with:
          path: data/events
          key: phase3-events-${{ github.run_id }}
          restore-keys: phase3-events-

      - name: Fetch disclosure events (EDGAR + House Clerk)
        run: |
          uv run python scripts/phase3_fetch.py insiders &
          P1=$!
          uv run python scripts/phase3_fetch.py house &
          P2=$!
          wait $P1 $P2
          uv run python scripts/phase3_fetch.py cik-map
          uv run python scripts/phase3_fetch.py f13f
          uv run python scripts/phase3_fetch.py shares

      - name: Build PIT feature panel
        run: uv run python scripts/phase3_build.py --market us

      - name: Tests
        run: uv run python -m pytest tests/test_phase3.py -x -q

      - name: Upload panel artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase3-events
          path: |
            data/events/*.parquet
            data/events/manifest.json
          retention-days: 90

  run-oof:
    if: inputs.job == 'oof' || inputs.job == 'holdout'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --frozen --no-dev

      - name: Fetch Alpaca US qlib dump (workflow artifact)
        run: |
          gh run download -R ${{ github.repository }} -n us-qlib-dump \
            -D data/qlib/us_alpaca
          test -f data/qlib/us_alpaca/calendars/day.txt

      - name: Restore events cache (written by the fetch job)
        uses: actions/cache@v4
        with:
          path: data/events
          key: phase3-events-oof-${{ github.run_id }}
          restore-keys: phase3-events-

      - name: Build panel + tests (refetch if cache empty)
        run: |
          if [ ! -f data/events/insider_events.parquet ]; then
            uv run python scripts/phase3_fetch.py insiders &
            P1=$!
            uv run python scripts/phase3_fetch.py house &
            P2=$!
            wait $P1 $P2
            uv run python scripts/phase3_fetch.py cik-map
            uv run python scripts/phase3_fetch.py f13f
            uv run python scripts/phase3_fetch.py shares
          fi
          uv run python scripts/phase3_build.py --market us
          uv run python -m pytest tests/test_phase3.py -x -q

      - name: Swapfile (alpha158_events handler peaks ~7.4GB > runner RAM)
        run: |
          sudo fallocate -l 8G /swapfile && sudo chmod 600 /swapfile \
            && sudo mkswap /swapfile && sudo swapon /swapfile \
            && free -h

      - name: Restore OOF checkpoints (resume on rerun)
        uses: actions/cache@v4
        with:
          path: results/oof/us_events
          key: phase3-oof-v2-us-${{ github.run_id }}
          restore-keys: phase3-oof-v2-us-

      - name: Run Phase-3 pipeline (us events)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B phase3/top-traders
          ckpt() {
            git fetch origin phase3/top-traders -q 2>/dev/null || true
            git add results/oof/us_events results/phase2_us_events.json \
                    results/holdout_log.jsonl 2>/dev/null || true
            git diff --cached --quiet && return 0
            git commit -qm "oof checkpoint (us_events, ${{ github.run_id }})" || return 0
            git pull --rebase origin phase3/top-traders -q 2>/dev/null \
              || { git rebase --abort -q 2>/dev/null; return 0; }
            git push -q origin HEAD:phase3/top-traders 2>/dev/null || true
          }
          ARGS="--market us --spec walkforward_us_events --key us_events \
                --threads ${{ inputs.threads }}"
          if [ "${{ inputs.job }}" = "holdout" ]; then
            ARGS="$ARGS --holdout ${{ inputs.holdout_candidate }}"
          fi
          if [ -n "${{ inputs.models }}" ]; then
            ARGS="$ARGS --models ${{ inputs.models }}"
          fi
          if [ -n "${{ inputs.rules }}" ]; then
            ARGS="$ARGS --rules ${{ inputs.rules }}"
          fi
          uv run python scripts/phase2_run.py $ARGS &
          PIPE=$!
          while kill -0 $PIPE 2>/dev/null; do sleep 300; ckpt; done
          wait $PIPE; RC=$?
          ckpt
          exit $RC

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-us-${{ github.run_id }}
          path: |
            results/oof/us_events/
            results/phase2_us_events.json
            results/holdout_log.jsonl
          if-no-files-found: ignore

      - name: Commit results back to phase3/top-traders
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B phase3/top-traders
          git add results/oof/us_events results/phase2_us_events.json \
                  results/holdout_log.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to commit"; exit 0
          fi
          git commit -m "phase3 us results — run ${{ github.run_id }}"
          git fetch origin phase3/top-traders || true
          for i in 1 2 3; do
            git push origin "phase3/top-traders:phase3/top-traders" && break
            git pull --rebase origin phase3/top-traders
          done

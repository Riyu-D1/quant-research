name: phase6-benchmarks

# Phase-6 benchmark chase — three job types:
#   cn-oof    train the new CPU models on CN walk-forward folds
#             (cat,lrn,lgb5,lgb_rank + optional optuna lgb) with the same
#             checkpoint/resume discipline as phase2
#   us-select run the predeclared phase6_us signal/combo/portfolio grid on
#             pre-2025 data only -> results/phase6_us_select.json
#   us-holdout re-view the select winner on 2025+, apply the live gate
#   cn-score  one-shot holdout scoring of a chosen CN candidate
#
# Results commit back to phase6/benchmarks; holdout results also land in
# results/holdout_log.jsonl so they show up in the leaderboard.

on:
  workflow_dispatch:
    inputs:
      job:
        required: true
        type: choice
        options: [cn-oof, us-select, us-holdout, cn-score]
        default: cn-oof
      models:
        description: "cn-oof model list"
        required: false
        default: "cat,lrn,lgb5,lgb_rank"
      tune_trials:
        description: "Optuna trials for tuned LightGBM (0=skip)"
        required: false
        default: "30"
      holdout_candidate:
        description: 'cn-score: "signal@strategy", e.g. ewic_avg@topk'
        required: false
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  cn-oof:
    if: inputs.job == 'cn-oof'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6/benchmarks
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --frozen --no-dev

      - name: Restore qlib CN data (cached)
        uses: actions/cache@v4
        with:
          path: data/qlib/cn_data
          key: qlib-cn-data-v1

      - name: Download qlib CN data (cache miss only)
        run: |
          if [ ! -f data/qlib/cn_data/calendars/day.txt ]; then
            uv run python scripts/download_data.py \
              --target-dir data/qlib/cn_data --region cn
          fi

      - name: Restore OOF checkpoints (resume on rerun)
        uses: actions/cache@v4
        with:
          path: results/oof/cn
          key: phase6-oof-cn-${{ github.run_id }}
          restore-keys: |
            phase6-oof-cn-
            phase2-oof-cn-

      - name: Swap headroom (Alpha158 peaks ~7.5GB)
        run: |
          free -h; MNT=/mnt
          if [ "$(df --output=avail $PWD | tail -1)" -gt \
               "$(df --output=avail /mnt | tail -1)" ]; then MNT=$PWD; fi
          FREE_MB=$(df --output=avail -BM "$MNT" | tail -1 | tr -dc '0-9')
          SWAP_MB=$(( FREE_MB*60/100 > 4096 ? 4096 : FREE_MB*60/100 ))
          if [ "$SWAP_MB" -ge 512 ]; then
            sudo dd if=/dev/zero of="$MNT/swapfile6" bs=1M count=$SWAP_MB \
              status=none && sudo chmod 600 "$MNT/swapfile6" && \
            sudo mkswap "$MNT/swapfile6" && sudo swapon "$MNT/swapfile6"
          fi
          free -h

      - name: Run CN OOF (phase-6 models)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B phase6/benchmarks
          ckpt() {
            git fetch origin phase6/benchmarks -q 2>/dev/null || true
            git add results/oof/cn results/phase2_cn.json 2>/dev/null || true
            git diff --cached --quiet && return 0
            git commit -qm "phase6 cn oof checkpoint (${{ github.run_id }})" || return 0
            git pull --rebase origin phase6/benchmarks -q 2>/dev/null \
              || { git rebase --abort -q 2>/dev/null; return 0; }
            git push -q origin HEAD:phase6/benchmarks 2>/dev/null || true
          }
          uv run python scripts/phase2_run.py --market cn \
            --models "${{ inputs.models }}" \
            --tune-trials "${{ inputs.tune_trials }}" --threads 4 &
          PIPE=$!
          while kill -0 $PIPE 2>/dev/null; do sleep 300; ckpt; done
          wait $PIPE; RC=$?
          ckpt
          exit $RC

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-cn-${{ github.run_id }}
          path: |
            results/oof/cn/
            results/phase2_cn.json
          if-no-files-found: ignore

      - name: Commit results to phase6/benchmarks
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B phase6/benchmarks
          git add results/oof/cn results/phase2_cn.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing"; exit 0; fi
          git commit -m "phase6 cn results — run ${{ github.run_id }}"
          git fetch origin phase6/benchmarks || true
          for i in 1 2 3; do
            git push origin "phase6/benchmarks:phase6/benchmarks" && break
            git pull --rebase origin phase6/benchmarks
          done

  us-select:
    if: inputs.job == 'us-select'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6/benchmarks
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --frozen --no-dev --no-install-package torch --no-install-package xgboost --no-install-package mlflow --no-install-package optuna --no-install-package cvxpy

      - name: Fetch US dump + events + fundamentals
        run: |
          art() {  # fetch latest unexpired artifact $1 -> $2 via API
            AID=$(gh api repos/${{ github.repository }}/actions/artifacts --paginate \
              -q "[.artifacts[] | select(.name==\"$1\" and (.expired|not)) | .id] | max")
            gh api repos/${{ github.repository }}/actions/artifacts/$AID/zip \
              > /tmp/a.zip
            mkdir -p "$2" && unzip -o -q /tmp/a.zip -d "$2"
          }
          art us-qlib-dump data/qlib/us_alpaca
          test -f data/qlib/us_alpaca/calendars/day.txt
          art phase3-events /tmp/p3ev
          mkdir -p data/events
          find /tmp/p3ev -name features_us.parquet -exec cp {} data/events/ \;
          find /tmp/p3ev -name shares_out.parquet -exec cp {} data/events/ \;
          test -f data/events/features_us.parquet
          art phase4-inputs data/events || true
          ls data/events/

      - name: Run US select grid (pre-2025 only)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B phase6/benchmarks
          uv run --no-sync python scripts/phase6_us.py select \
            --out results/phase6_us_select.json
          git add results/phase6_us_select.json configs/live_signal.yaml || true
          git commit -qm "phase6 us select — run ${{ github.run_id }}" || true
          git push -q origin HEAD:phase6/benchmarks 2>/dev/null || true

      - name: Upload select artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-us-select
          path: results/phase6_us_select.json
          if-no-files-found: error
          retention-days: 90

  us-holdout:
    if: inputs.job == 'us-holdout'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6/benchmarks
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --frozen --no-dev --no-install-package torch --no-install-package xgboost --no-install-package mlflow --no-install-package optuna --no-install-package cvxpy

      - name: Fetch US dump + events + fundamentals + select result
        run: |
          art() {
            AID=$(gh api repos/${{ github.repository }}/actions/artifacts --paginate \
              -q "[.artifacts[] | select(.name==\"$1\" and (.expired|not)) | .id] | max")
            gh api repos/${{ github.repository }}/actions/artifacts/$AID/zip \
              > /tmp/a.zip
            mkdir -p "$2" && unzip -o -q /tmp/a.zip -d "$2"
          }
          art us-qlib-dump data/qlib/us_alpaca
          test -f data/qlib/us_alpaca/calendars/day.txt
          art phase3-events /tmp/p3ev
          mkdir -p data/events
          find /tmp/p3ev -name features_us.parquet -exec cp {} data/events/ \;
          find /tmp/p3ev -name shares_out.parquet -exec cp {} data/events/ \;
          test -f data/events/features_us.parquet
          art phase4-inputs data/events || true
          art phase6-us-select results

      - name: Score US holdout (re-viewed, once)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B phase6/benchmarks
          uv run --no-sync python scripts/phase6_us.py holdout \
            --select results/phase6_us_select.json \
            --out results/phase6_us_holdout.json
          python - <<'PY'
          import json, time
          s = json.load(open("results/phase6_us_holdout.json"))
          with open("results/holdout_log.jsonl", "a") as f:
              f.write(json.dumps({"ts": time.strftime("%Y-%m-%d %H:%M:%S"),
                                  "stage": "phase6_us", **s}) + "\n")
          PY
          git add results/phase6_us_holdout.json results/holdout_log.jsonl \
                  configs/live_signal.yaml || true
          git commit -qm "phase6 us holdout (re-viewed) — run ${{ github.run_id }}" || true
          git push -q origin HEAD:phase6/benchmarks 2>/dev/null || true

      - name: Upload holdout artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-us-holdout-${{ github.run_id }}
          path: results/phase6_us_holdout.json
          if-no-files-found: error

  cn-score:
    if: inputs.job == 'cn-score'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6/benchmarks
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --frozen --no-dev

      - name: Restore qlib CN data (cached)
        uses: actions/cache@v4
        with:
          path: data/qlib/cn_data
          key: qlib-cn-data-v1

      - name: Download qlib CN data (cache miss only)
        run: |
          if [ ! -f data/qlib/cn_data/calendars/day.txt ]; then
            uv run python scripts/download_data.py \
              --target-dir data/qlib/cn_data --region cn
          fi

      - name: Swap headroom
        run: |
          MNT=/mnt
          if [ "$(df --output=avail $PWD | tail -1)" -gt \
               "$(df --output=avail /mnt | tail -1)" ]; then MNT=$PWD; fi
          FREE_MB=$(df --output=avail -BM "$MNT" | tail -1 | tr -dc '0-9')
          SWAP_MB=$(( FREE_MB*60/100 > 4096 ? 4096 : FREE_MB*60/100 ))
          if [ "$SWAP_MB" -ge 512 ]; then
            sudo dd if=/dev/zero of="$MNT/swapfile6" bs=1M count=$SWAP_MB \
              status=none && sudo chmod 600 "$MNT/swapfile6" && \
            sudo mkswap "$MNT/swapfile6" && sudo swapon "$MNT/swapfile6"
          fi

      - name: Score CN holdout candidate (re-viewed, once)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B phase6/benchmarks
          # all model names are needed so ensemble candidates can assemble;
          # gpu-required ones are skipped automatically when their fold
          # preds are absent.
          uv run python scripts/phase2_run.py --market cn \
            --models "lgb,xgb,de,hist,cat,lrn,lgb5,lgb_rank,lgb_tuned" \
            --threads 4 \
            --holdout "${{ inputs.holdout_candidate }}"
          git add results/phase2_cn.json results/holdout_log.jsonl \
                  results/oof/cn 2>/dev/null || true
          git commit -qm "phase6 cn holdout (re-viewed) — run ${{ github.run_id }}" || true
          git push -q origin HEAD:phase6/benchmarks 2>/dev/null || true

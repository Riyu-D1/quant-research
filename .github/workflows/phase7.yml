name: phase7-us-live

# Phase-7 core+satellite select + ONE-SHOT 2026 holdout.
#
#   select   scores every predeclared candidate (configs/experiments/
#            phase7_us.yaml — committed BEFORE this job runs) on the
#            pre-2025 OOF window ONLY, applies the predeclared selection
#            rule, and commits results/phase7_us_select.json +
#            configs/live_signal.yaml (pinned to the winner) back to
#            phase7/us-live. The 2026 window is not touched here.
#   holdout  runs ONLY after the select commit lands: every candidate
#            is re-scored on the re-viewed 2025 window (already seen in
#            phases 2/4/5/6 — reported, never tuned on), then the
#            SELECTED candidate + the SPY baseline are scored once on the
#            FRESH 2026 window. The match gate decides whether
#            `validated` flips true. Results -> results/
#            phase7_us_holdout.json + results/holdout_log.jsonl.
#
# Honesty: n_trials continues the running holdout_log.jsonl total and
# counts every candidate-window scored. No candidate is ever re-run on
# the fresh window, and no selection ever reads it.

on:
  workflow_dispatch:
    inputs:
      job:
        required: true
        type: choice
        options: [select, holdout]
        default: select

permissions:
  contents: write
  actions: read

jobs:
  select:
    name: OOF select (pre-2025 only)
    if: inputs.job == 'select'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase7/us-live
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"
      - run: >-
          uv sync --frozen --no-dev --no-install-package torch
          --no-install-package xgboost --no-install-package mlflow
          --no-install-package optuna --no-install-package cvxpy

      - name: Fetch US dump + events + fundamentals
        run: |
          art() {  # fetch latest unexpired artifact $1 -> $2 via API
            AID=$(gh api repos/${{ github.repository }}/actions/artifacts --paginate \
              -q ".artifacts[] | select(.name==\"$1\" and (.expired|not)) | .id" | sort -n | tail -1)
            [ -n "$AID" ] || { echo "artifact $1 not found"; return 1; }
            gh api repos/${{ github.repository }}/actions/artifacts/$AID/zip \
              > /tmp/a.zip
            mkdir -p "$2" && unzip -o -q /tmp/a.zip -d "$2"
          }
          art us-qlib-dump data/qlib/us_alpaca
          test -f data/qlib/us_alpaca/calendars/day.txt
          art phase3-events /tmp/p3ev
          mkdir -p data/events
          find /tmp/p3ev -name features_us.parquet -exec cp {} data/events/ \;
          find /tmp/p3ev -name shares_out.parquet -exec cp {} data/events/ \;
          test -f data/events/features_us.parquet
          art phase4-inputs data/events || true
          ls data/events/

      - name: Run phase-7 select (pre-2025 OOF)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B phase7/us-live
          uv run --no-sync python scripts/phase7_us.py select \
            --out results/phase7_us_select.json
          git add results/phase7_us_select.json configs/live_signal.yaml || true
          git commit -qm "phase7 us select (pre-2025 OOF) — run ${{ github.run_id }}" || true
          git push -q origin HEAD:phase7/us-live 2>/dev/null || true

      - name: Upload select artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-us-select
          path: results/phase7_us_select.json
          if-no-files-found: error
          retention-days: 90

  holdout:
    name: holdout (2025 re-view + ONE 2026 look)
    if: inputs.job == 'holdout'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase7/us-live
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"
      - run: >-
          uv sync --frozen --no-dev --no-install-package torch
          --no-install-package xgboost --no-install-package mlflow
          --no-install-package optuna --no-install-package cvxpy

      - name: Fetch US dump + events + fundamentals + select result
        run: |
          art() {
            AID=$(gh api repos/${{ github.repository }}/actions/artifacts --paginate \
              -q ".artifacts[] | select(.name==\"$1\" and (.expired|not)) | .id" | sort -n | tail -1)
            [ -n "$AID" ] || { echo "artifact $1 not found"; return 1; }
            gh api repos/${{ github.repository }}/actions/artifacts/$AID/zip \
              > /tmp/a.zip
            mkdir -p "$2" && unzip -o -q /tmp/a.zip -d "$2"
          }
          art us-qlib-dump data/qlib/us_alpaca
          test -f data/qlib/us_alpaca/calendars/day.txt
          art phase3-events /tmp/p3ev
          mkdir -p data/events
          find /tmp/p3ev -name features_us.parquet -exec cp {} data/events/ \;
          find /tmp/p3ev -name shares_out.parquet -exec cp {} data/events/ \;
          test -f data/events/features_us.parquet
          art phase4-inputs data/events || true
          art phase7-us-select results || true   # committed copy is primary
          test -f results/phase7_us_select.json  # select must have landed
          ls data/events/

      - name: Run phase-7 holdout (single 2026 look)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B phase7/us-live
          uv run --no-sync python scripts/phase7_us.py holdout \
            --select results/phase7_us_select.json \
            --out results/phase7_us_holdout.json
          git add results/phase7_us_holdout.json results/holdout_log.jsonl \
                  configs/live_signal.yaml || true
          git commit -qm "phase7 us holdout (single 2026 look) — run ${{ github.run_id }}" || true
          git push -q origin HEAD:phase7/us-live 2>/dev/null || true

      - name: Upload holdout artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-us-holdout-${{ github.run_id }}
          path: results/phase7_us_holdout.json
          if-no-files-found: error

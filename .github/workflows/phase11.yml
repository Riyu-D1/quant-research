name: phase11-hybrid

# Phase-11: honest PIT baseline + hybrid LLM/algorithmic bot
# (configs/experiments/phase11_us.yaml, predeclared before any run).
#
#   data      PIT membership (pinned fja05680 + Wikipedia snapshots), the
#             Alpaca dump rebuilt from that universe through sample_end,
#             one SEC companyfacts pull (vq + tilt tags, shares) and the
#             phase-10 ETF bars -> artifact phase11-inputs; membership csv
#             and audits committed.
#   baseline  honest B50 vs the old ever-member B50 and SPY on the dev
#             window (holdout sealed) -> results/phase11/baseline_dev.json
#             and every honest pick (checked by tests/test_phase11.py).
#
# Triggers: workflow_dispatch (needs this file on master), or a push to
# phase11/hybrid whose head commit message carries [p11:<job>].
# Nothing here trades or writes a paper/live config.

on:
  workflow_dispatch:
    inputs:
      job:
        required: true
        type: choice
        options: [data, baseline]
        default: baseline
  push:
    branches: [phase11/hybrid]

permissions:
  contents: write
  actions: read

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  data:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.job == 'data')
      || (github.event_name == 'push'
          && contains(github.event.head_commit.message, '[p11:data]'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: ALPACA_API_KEY   # paper data keys (historical bars only)
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"
      - run: >-
          uv sync --frozen --no-dev --no-install-package torch
          --no-install-package xgboost --no-install-package mlflow
          --no-install-package optuna --no-install-package cvxpy
      - name: PIT membership (pinned fja05680 + Wikipedia snapshots)
        run: uv run --no-sync python scripts/phase11_us.py universe --out build/universe_sp500.csv
      - name: Rebuild the Alpaca dump from the PIT universe through sample_end
        run: |
          END_ARG=$(uv run --no-sync python -c "import yaml;print(yaml.safe_load(open('configs/experiments/phase11_us.yaml'))['sample_end'])")
          uv run --no-sync python scripts/alpaca_us_data.py fetch \
            --universe-csv build/universe_sp500.csv --csv-dir data/us_alpaca_csv \
            --start 2016-01-01 --end "$END_ARG" --feed auto \
            --coverage-json build/coverage.json
          uv run --no-sync python scripts/us_data_to_qlib.py \
            --input-dir data/us_alpaca_csv --output-dir data/qlib/us_alpaca --universe sp500
          uv run --no-sync python scripts/alpaca_us_data.py finalize \
            --qlib-dir data/qlib/us_alpaca --csv-dir data/us_alpaca_csv \
            --universe-csv build/universe_sp500.csv --universe sp500
          tail -1 data/qlib/us_alpaca/calendars/day.txt
      - name: Inputs from earlier phases (cik_map, phase-10 ETF bars)
        run: |
          art() {
            AID=$(gh api repos/${{ github.repository }}/actions/artifacts --paginate \
              -q ".artifacts[] | select(.name==\"$1\" and (.expired|not)) | .id" | sort -n | tail -1)
            [ -n "$AID" ] || { echo "artifact $1 not found"; return 1; }
            gh api repos/${{ github.repository }}/actions/artifacts/$AID/zip > /tmp/a.zip
          }
          mkdir -p data/events data/etf
          art phase3-events && unzip -o -j /tmp/a.zip cik_map.parquet -d data/events/
          art phase10-inputs && unzip -o -j /tmp/a.zip etf/etf_bars.parquet -d data/etf/
          test -f data/events/cik_map.parquet && test -f data/etf/etf_bars.parquet
      - name: SEC companyfacts (vq + tilt tags, shares outstanding)
        run: uv run --no-sync python scripts/phase11_us.py sec
      - uses: actions/upload-artifact@v4
        with:
          name: phase11-inputs
          path: |
            data/qlib/us_alpaca
            data/events/fundamentals.parquet
            data/events/shares_out.parquet
            data/events/cik_map.parquet
            data/etf/etf_bars.parquet
          retention-days: 90
      - name: Commit membership + coverage to the running branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp build/coverage.json results/phase11/sp500_coverage.json
          git add results/phase11/
          git commit -qm "phase11 data — run ${{ github.run_id }}" || exit 0
          for i in 1 2 3; do
            git push -q origin "HEAD:${{ github.ref_name }}" && break
            git pull -q --rebase origin "${{ github.ref_name }}"
          done

  baseline:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.job == 'baseline')
      || (github.event_name == 'push'
          && contains(github.event.head_commit.message, '[p11:baseline]'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"
      - run: >-
          uv sync --frozen --no-dev --no-install-package torch
          --no-install-package xgboost --no-install-package mlflow
          --no-install-package optuna --no-install-package cvxpy
      - name: Fetch phase11-inputs
        run: |
          AID=$(gh api repos/${{ github.repository }}/actions/artifacts --paginate \
            -q '.artifacts[] | select(.name=="phase11-inputs" and (.expired|not)) | .id' | sort -n | tail -1)
          [ -n "$AID" ] || { echo "phase11-inputs not found — run [p11:data] first"; exit 1; }
          gh api repos/${{ github.repository }}/actions/artifacts/$AID/zip > /tmp/a.zip
          mkdir -p data && unzip -o -q /tmp/a.zip -d data
          tail -1 data/qlib/us_alpaca/calendars/day.txt
      - name: Honest baseline (dev window, holdout sealed)
        run: uv run --no-sync python scripts/phase11_us.py baseline
      - name: Commit results to the running branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/phase11/ results/holdout_log.jsonl
          git commit -qm "phase11 baseline — run ${{ github.run_id }}" || exit 0
          for i in 1 2 3; do
            git push -q origin "HEAD:${{ github.ref_name }}" && break
            git pull -q --rebase origin "${{ github.ref_name }}"
          done

name: paper-trade
# ─────────────────────────────────────────────────────────────────────────────
# MicroTop5 paper bot — Phase-4 adaptive signal, Alpaca PAPER account only,
# Notion trade journal. Signal is UNVALIDATED until the 2025+ holdout clears
# the gate; every log/journal entry carries the flag.
#
#   run       one trading day end-to-end (manual dispatch — or the schedule
#             below once the owner enables it). Needs Alpaca paper + Notion
#             secrets; hard-refuses any non-paper base URL.
#   mock_day  CI smoke: a full day with mocked Alpaca/Notion (no keys needed).
#
# Secrets (GitHub Environment "ALPACA_API_KEY" holds the Alpaca pair; add the
# Notion ones as repo secrets — see docs/BOT_SETUP.md):
#   ALPACA_API_KEY, ALPACA_API_SECRET  — paper trading keys, paper-api only
#   NOTION_TOKEN                     — internal integration secret
#   NOTION_DB_ID                     — Trade Journal db (after notion_setup.py)
#   NOTION_PARENT_PAGE_ID            — only used to create the db if DB unset
# ─────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      date:
        description: "override signal day YYYY-MM-DD (default: latest bar)"
        required: false
      dry_run:
        description: "journal to a file instead of Notion (orders still paper)"
        required: false
        default: "false"
      fixture:
        description: "optional parquet of closes (fully offline day)"
        required: false
      config:
        description: "signal config (configs/live_signal_test.yaml = regime guard off, test only)"
        required: false
        default: "configs/live_signal.yaml"
      job:
        description: "run = one paper day; refresh_snapshot = rebuild state/live snapshots"
        required: false
        type: choice
        options: [run, refresh_snapshot]
        default: run
  # ── DISABLED until the owner says enable: after the US close, Mon–Fri ──
  # schedule:
  #   - cron: "0 22 * * 1-5"   # daily paper run — 22:00 UTC, after close
  #   - cron: "0 9 1 * *"      # monthly snapshot refresh — 1st, 09:00 UTC
  push:
    paths:
      - scripts/paper_trade.py
      - scripts/notion_setup.py
      - scripts/live_holdout.py
      - scripts/live_snapshot.py
      - src/quant_research/**
      - tests/test_paper_trade.py
      - tests/test_live_holdout.py
      - configs/live_signal.yaml
      - configs/live_signal_test.yaml
      - .github/workflows/paper_trade.yml
  pull_request:
    paths:
      - scripts/paper_trade.py
      - scripts/notion_setup.py
      - scripts/live_holdout.py
      - scripts/live_snapshot.py
      - src/quant_research/**
      - tests/test_paper_trade.py
      - tests/test_live_holdout.py
      - configs/live_signal.yaml
      - configs/live_signal_test.yaml
      - .github/workflows/paper_trade.yml

permissions:
  contents: read

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  mock_day:
    name: mocked full day (CI, no keys)
    # skipped on master dispatch-copy pushes (tests live on phase4/adaptive)
    if: hashFiles('tests/test_paper_trade.py') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: env (slim — no torch/xgb/mlflow/optuna/cvxpy)
        run: |
          uv sync --no-install-package torch --no-install-package xgboost \
            --no-install-package mlflow --no-install-package optuna \
            --no-install-package cvxpy
          uv cache clean
      - name: full-day mocked run (fake Alpaca + Notion)
        run: uv run --no-sync python -m pytest tests/test_paper_trade.py tests/test_live_holdout.py -x -q
      - name: dry-run journal artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-mock-day
          path: results/paper_dryrun/
          if-no-files-found: ignore
          retention-days: 14

  run:
    name: paper day
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.job != 'refresh_snapshot')
      || (github.event_name == 'schedule' && github.event.schedule == '0 22 * * 1-5')
    runs-on: ubuntu-latest
    environment: ALPACA_API_KEY   # env holding the paper keys
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
      NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
      # Live-trading interlock secret — intentionally UNSET. The bot only
      # permits a non-paper base URL when live_trading:true in the config
      # AND this secret equals I_UNDERSTAND_LIVE_RISK. Never set it.
      LIVE_TRADING_ACK: ${{ secrets.LIVE_TRADING_ACK }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: env (slim)
        run: |
          uv sync --no-install-package torch --no-install-package xgboost \
            --no-install-package mlflow --no-install-package optuna \
            --no-install-package cvxpy
          uv cache clean
      - name: keys sanity
        run: |
          [ -n "$ALPACA_API_KEY" ] || { echo "ALPACA_API_KEY secret missing"; exit 1; }
          [ -n "$ALPACA_SECRET_KEY" ] || { echo "ALPACA_API_SECRET secret missing"; exit 1; }
          [ -n "$NOTION_TOKEN" ] || echo "::warning::NOTION_TOKEN missing — journal writes will fail unless dry_run"
      - name: paper day
        env:
          ARGS: >-
            ${{ github.event.inputs.date != '' && format('--date {0}', github.event.inputs.date) || '' }}
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
            ${{ github.event.inputs.fixture != '' && format('--fixture {0}', github.event.inputs.fixture) || '' }}
            ${{ github.event.inputs.config != '' && format('--config {0}', github.event.inputs.config) || '' }}
        run: |
          set -x
          uv run --no-sync python scripts/paper_trade.py $ARGS
      - name: day journal artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-day-${{ github.run_id }}
          path: |
            results/paper_dryrun/
            state/live/weights.json
          if-no-files-found: ignore
          retention-days: 30
      - name: failure annotation
        if: failure()
        run: |
          echo "::error::paper day failed — see the step log; the bot also"
          echo "::error::writes an 'error' row to the Notion Trade Journal"

  # Rebuild state/live/{vq,news}_snapshot.parquet from the freshest store
  # inputs and commit them to phase4/adaptive — keeps the snapshot signals
  # inside their 45-day staleness window without any Mac-side work.
  snapshot:
    name: refresh live snapshots
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.job == 'refresh_snapshot')
      || (github.event_name == 'schedule' && github.event.schedule == '0 9 1 * *')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # commits state/live/ back to phase4/adaptive
      actions: read     # downloads the input artifacts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4/adaptive      # the snapshots live on the bot branch
      - uses: astral-sh/setup-uv@v5
      - name: env (slim)
        run: |
          uv sync --no-install-package torch --no-install-package xgboost \
            --no-install-package mlflow --no-install-package optuna \
            --no-install-package cvxpy
          uv cache clean
      - name: Fetch inputs (qlib dump + shares + fundamentals)
        run: |
          gh run download -R ${{ github.repository }} -n us-qlib-dump \
            -D data/qlib/us_alpaca
          test -f data/qlib/us_alpaca/calendars/day.txt
          AID=$(gh api repos/${{ github.repository }}/actions/artifacts \
            -q '[.artifacts[] | select(.name=="phase3-events" and (.expired|not)) | .id] | max')
          gh api repos/${{ github.repository }}/actions/artifacts/$AID/zip \
            > /tmp/p3ev.zip
          mkdir -p data/events
          unzip -o -j /tmp/p3ev.zip shares_out.parquet -d data/events/
          gh run download -R ${{ github.repository }} -n phase4-inputs \
            -D data/events
          test -f data/events/fundamentals.parquet
      - name: Rebuild snapshots
        run: uv run --no-sync python scripts/live_snapshot.py
      - name: Commit snapshots to phase4/adaptive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/live/
          if git diff --cached --quiet; then
            echo "snapshots unchanged"; exit 0
          fi
          git commit -m "live snapshot refresh — run ${{ github.run_id }}"
          git fetch origin phase4/adaptive || true
          for i in 1 2 3; do
            git push origin "phase4/adaptive:phase4/adaptive" && break
            git pull --rebase origin phase4/adaptive
          done
